name: Recast checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  recast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install rendering and DOM test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm install --prefix "$RUNNER_TEMP/recast-deps" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Check browser sources
        run: |
          node --check tools/recast/core.js
          node --check tools/recast/recast.js
          node --check tools/recast/render-source.js
      - name: Test cue editing and uninterrupted playback
        run: RECAST_TEST_DEPS="$RUNNER_TEMP/recast-deps" node --test tests/*.test.mjs
      - name: Render and verify layout pixels and unchanged audio
        run: python3 -m unittest discover -s tests -p 'test_recast.py' -v
