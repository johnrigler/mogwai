name: Mogwai share widget

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check browser JavaScript
        run: |
          node --check app/core.js
          node --check app/app.js
          node --check app/sw.js
      - name: Test shares, URL handoff, and offline receiver
        run: node --test tests/mogwai-share.test.cjs
