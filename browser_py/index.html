<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SB Shell / Mogwai</title>
<style>
body{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;margin:0;background:#111;color:#ddd}
header{padding:12px 16px;border-bottom:1px solid #333;position:sticky;top:0;background:#111}
main{display:grid;grid-template-columns:minmax(240px,32%) 1fr;min-height:calc(100vh - 48px)}
#tree{border-right:1px solid #333;padding:12px;overflow:auto}
#view{padding:18px;white-space:pre-wrap;overflow:auto}
button{font:inherit;color:#ddd;background:#181818;border:1px solid #444;padding:6px 8px;margin:2px;cursor:pointer}
button:hover{background:#252525}
.meta{opacity:.6;font-size:.85em}
@media(max-width:700px){main{grid-template-columns:1fr}#tree{border-right:0;border-bottom:1px solid #333}}
</style>
</head>
<body>
<header><strong>SB Shell / Mogwai</strong> <span id="where" class="meta"></span></header>
<main>
  <section id="tree"></section>
  <section id="view">Select a file.</section>
</main>
<script>
const tree = document.querySelector("#tree");
const view = document.querySelector("#view");
const where = document.querySelector("#where");
let current = "";

async function list(path="") {
  const r = await fetch("/api/list?path=" + encodeURIComponent(path));
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "list failed");
  current = data.path;
  where.textContent = data.root + (data.path ? "/" + data.path : "");
  tree.innerHTML = "";

  if (current) {
    const up = document.createElement("button");
    up.textContent = "..";
    up.onclick = () => list(current.split("/").slice(0,-1).join("/"));
    tree.append(up, document.createElement("br"));
  }

  for (const entry of data.entries) {
    const b = document.createElement("button");
    const ordinal = entry.coordinate ? "[" + entry.coordinate + "] " : "";
    b.textContent = (entry.type === "dir" ? "▸ " : "") + ordinal + entry.name;
    b.onclick = () => entry.type === "dir" ? list(entry.path) : load(entry.path);
    tree.append(b, document.createElement("br"));
  }
}

async function load(path) {
  const r = await fetch("/api/load?path=" + encodeURIComponent(path));
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "load failed");
  view.textContent = data.content;
}

list().catch(err => view.textContent = err.message);
</script>
</body>
</html>
